name: Links

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - '**/*.html'
      - '.lycheeignore'
      - '.github/workflows/lychee.yml'

  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '**/*.html'
      - '.lycheeignore'
      - '.github/workflows/lychee.yml'

  schedule:
    - cron: '17 3 * * 1'

  workflow_dispatch:

concurrency:
  group: links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    name: Check documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --cache
            --max-retries 3
            --timeout 20
            --root-dir .
            './**/*.md'
            './**/*.html'
          fail: true
          failIfEmpty: false
          jobSummary: true