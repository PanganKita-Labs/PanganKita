name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  quality:
    name: Flutter quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run strict Flutter analyzer
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Dart Code Linter
        run: >
          dart run dart_code_linter:metrics analyze
          --reporter=github
          --fatal-style
          --fatal-performance
          --fatal-warnings
          lib

      - name: Check unused Dart code
        run: >
          dart run dart_code_linter:metrics
          check-unused-code
          --analyze-private-members
          lib

      - name: Check unused Dart files
        run: >
          dart run dart_code_linter:metrics
          check-unused-files
          lib

      - name: Check unnecessary nullable parameters
        run: >
          dart run dart_code_linter:metrics
          check-unnecessary-nullable
          lib

      - name: Run complexity analysis
        run: dart run dartrics analyze lib

      - name: Run tests with coverage
        run: flutter test --coverage