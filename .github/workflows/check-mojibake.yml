name: Text Integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-integrity:
    name: UTF-8, mojibake, and whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check UTF-8 and mojibake
        run: python3 .github/scripts/check_mojibake.py

      - name: Check trailing whitespace
        run: python3 .github/scripts/check_trailing_whitespace.py