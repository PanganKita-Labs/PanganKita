name: Workflow Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'

  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color