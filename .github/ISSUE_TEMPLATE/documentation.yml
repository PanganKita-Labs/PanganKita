name: Documentation improvement
description: Report missing, inaccurate, outdated, or unclear PanganKita documentation
title: "docs: "
labels:
  - documentation

body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the README and relevant documentation.
          required: true
        - label: I searched existing documentation issues.
          required: true

  - type: input
    id: location
    attributes:
      label: Documentation location
      placeholder: README section, file path, heading, or URL
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type of improvement
      options:
        - Incorrect information
        - Missing development or setup step
        - Missing architecture documentation
        - Missing product or business-rule documentation
        - Missing food-safety clarification
        - Missing privacy or security clarification
        - Missing accessibility guidance
        - Missing testing guidance
        - Missing research methodology or evidence
        - Unclear explanation
        - Missing example
        - Broken link
        - Outdated version or command
        - Typo or formatting
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What should be improved?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or structure
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Source or evidence
      description: |
        Include a source when proposing corrections to research, regulatory,
        food-safety, competitor, or impact claims.
    validations:
      required: false
