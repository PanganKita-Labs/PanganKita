include: package:very_good_analysis/analysis_options.yaml

# ============================================================
# Dart analyzer
# ============================================================

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - android/**

# ============================================================
# Analysis-server plugins
# ============================================================

plugins:
  dart_code_linter:
    diagnostics:
      # Correctness / type safety
      avoid-dynamic: error
      avoid-collection-methods-with-unrelated-types: error
      avoid-passing-async-when-sync-expected: error
      avoid-unrelated-type-assertions: error

      # Maintainability
      avoid-global-state: warning
      avoid-ignoring-return-values: warning
      avoid-late-keyword: warning
      avoid-nested-conditional-expressions: warning
      avoid-non-null-assertion: warning
      avoid-redundant-async: warning
      avoid-unnecessary-conditionals: warning
      avoid-unnecessary-type-assertions: warning
      avoid-unnecessary-type-casts: warning
      avoid-unused-parameters: warning
      no-empty-block: warning
      no-equal-arguments: warning
      no-equal-then-else: error
      no-magic-number: warning
      prefer-commenting-analyzer-ignores: warning

      # Flutter lifecycle / performance
      always-remove-listener: error
      avoid-returning-widgets: warning
      avoid-shrink-wrap-in-lists: warning
      avoid-unnecessary-setstate: warning
      avoid-wrapping-in-padding: info
      prefer-correct-edge-insets-constructor: info
      prefer-media-query-direct-access: info
      prefer-using-list-view: info
      use-setstate-synchronously: error
      avoid-non-configurable-callbacks-in-init-state: warning

# ============================================================
# Extra native Dart lints
# ============================================================

linter:
  rules:
    # VGV deliberately leaves this disabled, but for PanganKita
    # we want explicit use of dynamic to be exceptional.
    avoid_annotating_with_dynamic: true

# ============================================================
# Dart Code Linter
# ============================================================

dart_code_linter:
  metrics:
    # Dartrics owns the main complexity gates.
    # These provide complementary structural limits.
    maximum-nesting-level: 4
    number-of-parameters: 4

  rules:
    # --------------------------------------------------------
    # Correctness / suspicious code
    # --------------------------------------------------------
    - avoid-cascade-after-if-null
    - avoid-collection-methods-with-unrelated-types
    - avoid-double-slash-imports
    - avoid-duplicate-exports
    - avoid-dynamic
    - avoid-global-state
    - avoid-ignoring-return-values

    - avoid-late-keyword:
        allow-initialized: true

    - avoid-missing-enum-constant-in-map
    - avoid-nested-conditional-expressions
    - avoid-non-null-assertion
    - avoid-passing-async-when-sync-expected
    - avoid-redundant-async
    - avoid-throw-in-catch-block
    - avoid-unnecessary-conditionals
    - avoid-unnecessary-type-assertions
    - avoid-unnecessary-type-casts
    - avoid-unrelated-type-assertions
    - avoid-unused-parameters:
        ignore-inline-functions: false

    - binary-expression-operand-order
    - no-boolean-literal-compare
    - no-empty-block
    - no-equal-arguments
    - no-equal-then-else

    # --------------------------------------------------------
    # Discourage unexplained numeric literals.
    #
    # Very useful once our spacing, durations, thresholds,
    # radii, limits, etc. become design/domain constants.
    # --------------------------------------------------------
    - no-magic-number:
        allowed:
          - -1
          - 0
          - 1
          - 2
        exclude:
          - test/**

    # --------------------------------------------------------
    # Maintainability / consistency
    # --------------------------------------------------------
    - prefer-commenting-analyzer-ignores

    - prefer-match-file-name:
        exclude:
          - test/**

    - prefer-named-record-fields

    # --------------------------------------------------------
    # Testing
    # --------------------------------------------------------
    - missing-test-assertion
    - prefer-correct-test-file-name

    # --------------------------------------------------------
    # Flutter lifecycle / correctness
    # --------------------------------------------------------
    - always-remove-listener
    - avoid-returning-widgets
    - avoid-shrink-wrap-in-lists
    - avoid-unnecessary-setstate
    - avoid-wrapping-in-padding
    - check-for-equals-in-render-object-setters
    - consistent-update-render-object
    - use-setstate-synchronously
    - avoid-non-configurable-callbacks-in-init-state

    # --------------------------------------------------------
    # Flutter maintainability / performance
    # --------------------------------------------------------
    - prefer-const-border-radius
    - prefer-correct-edge-insets-constructor

    - prefer-extracting-callbacks:
        allowed-line-count: 3

    - prefer-media-query-direct-access

    - prefer-single-widget-per-file:
        ignore-private-widgets: true

    - prefer-using-list-view

  anti-patterns:
    - long-method
    - long-parameter-list

  unused-code:
    analyze-private-members: true
    analyze-public-members: false

# ============================================================
# Complexity / maintainability metrics
# ============================================================

dartrics:
  metrics:
    # Sonar-style cognitive complexity.
    cognitive-complexity:
      warning: 10
      error: 15

    # Mirrors the strictness you already use with Ruff C90.
    cyclomatic-complexity:
      warning: 10
      error: 15

    number-of-parameters:
      warning: 4
      error: 6

    # Disabled by default in Dartrics, so explicitly enable it.
    method-length:
      enabled: true
      warning: 50
      error: 80

  exclude:
    - "build/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"