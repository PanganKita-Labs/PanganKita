name: pangankita
description: A Flutter application for time-sensitive redistribution of eligible unsold food in Indonesia.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: 4.2960.0

dev_dependencies:
  dart_code_linter: 4.3.0
  dartrics: 1.4.0
  flutter_test:
    sdk: flutter
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo-primary.png
    - assets/food/pastry-box.png
    - assets/food/rice-meal.png
